<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resume Details Input</title>
    <style>
        
    </style>
    <link rel="stylesheet" href="../static/styles/style.css">
</head>
<body id="body">
    <div class="form-container">
        <h2>Enter Resume Details</h2>
        <form action="/submit" method="POST">
            <div class="form-group">
                <label>Date of birth</label>
                <input type="date" name="dob" required>
            </div>
            <div class="form-group">
                <label>Fathers name</label>
                <input type="text" name="father_name" placeholder="Enter Father Name" required>
            </div>
            <div class="form-group">
                <label>Mothers name</label>
                <input type="text" name="mother_name" placeholder="Enter Mother Name" required>
            </div>
            <div class="form-group">
                <label>Hobbies</label>
                <input type="text" name="hobbies" placeholder="Enter Hobbies" required>
            </div>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
